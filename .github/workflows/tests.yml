name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx quasar prepare
      - run: VITE_COVERAGE=true npm run build
      - run: tar -czf starlight-tech-radar-build.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-e2e
          path: |
            dist/
            starlight-tech-radar-build.tar.gz
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx quasar prepare
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 30

  e2e-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    needs: build-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts-e2e
      - run: apt-get update && apt-get install -y default-jre wget
      - name: Start WireMock
        run: |
          wget -q https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/3.12.1/wiremock-standalone-3.12.1.jar
          java -jar wiremock-standalone-3.12.1.jar --port 8080 --root-dir ./test/wiremock &
          timeout 60 bash -c 'until curl -s http://localhost:8080/__admin/health > /dev/null; do sleep 1; done'
      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          HOME: /root
          CI: true
          VITE_COVERAGE: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
            .nyc_output/
          retention-days: 30

  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: e2e-results
        continue-on-error: true
      - run: mkdir -p .nyc_output
      - run: cp coverage/unit/coverage-final.json .nyc_output/unit.json || true
      - run: npx nyc report -t .nyc_output --report-dir coverage/combined --reporter=text --reporter=cobertura --reporter=html --reporter=lcov --extension .vue --extension .ts --extension .js
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/combined/
          retention-days: 30

  sonar-scan:
    runs-on: ubuntu-latest
    needs: coverage-report
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/combined/
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
