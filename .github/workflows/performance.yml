name: Performance Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx quasar prepare
      - run: npm run build
      - run: tar -czf starlight-tech-radar-build.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            starlight-tech-radar-build.tar.gz
          retention-days: 1

  performance-test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx quasar prepare
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - run: npm i -g @lhci/cli lighthouse-badges --ignore-scripts
      - name: Download WireMock
        run: |
          wget -q https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/3.12.1/wiremock-standalone-3.12.1.jar
          echo "3a8c87f30aaf310bcb1cf8b86d346874834ca6acd901db2f8b19b9aa6a8066e2  wiremock-standalone-3.12.1.jar" | sha256sum -c -
      - run: java -jar wiremock-standalone-3.12.1.jar --port 8080 --root-dir ./test/wiremock &
      - run: timeout 30 bash -c 'while ! echo > /dev/tcp/localhost/8080; do sleep 1; done'
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          GITHUB_API_BASE_URL: http://localhost:8080
          GITLAB_API_BASE_URL: http://localhost:8080
          SLACK_WEBHOOK: http://localhost:8080/hooks/slack
          TEAMS_WEBHOOK: http://localhost:8080/hooks/teams
      - name: Generate Lighthouse Badges
        run: |
          mkdir -p badges
          npm run serve:prod &
          timeout 120 bash -c 'until curl -s http://127.0.0.1:3000/ > /dev/null; do sleep 1; done'
          lighthouse-badges -u http://127.0.0.1:3000 -o badges -r
          npm run serve:prod:stop
        env:
          NODE_ENV: production
          GITHUB_API_BASE_URL: http://localhost:8080
          GITLAB_API_BASE_URL: http://localhost:8080
          SLACK_WEBHOOK: http://localhost:8080/hooks/slack
          TEAMS_WEBHOOK: http://localhost:8080/hooks/teams
        continue-on-error: true
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            badges/
          retention-days: 30
      - name: Deploy Badges
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: badges
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
